<div class="toasts" id="toasts" role="region" aria-label="Notifikasi" aria-live="polite">{% if messages %}{% for m in messages %}
<div class="toast {% if m.tags == 'error' %}error{% elif m.tags == 'success' %}success{% elif m.tags == 'warning' %}warning{% else %}info{% endif %}" role="status">
  <span class="toast-msg">{{ m }}</span>
  <button type="button" class="toast-x" aria-label="Tutup notifikasi">{% include "partials/icon.html" with name="x" %}</button>
</div>{% endfor %}{% endif %}</div>
