{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Smart Training Analytics Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons untuk Ikon Mata -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #1D5FC4;
            --bs-primary-rgb: 29, 95, 196;
            --bs-body-font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            font-family: Inter, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            background-color: #F4F6FA;
            background-image: url("{% static 'images/login-bg.png' %}");
            background-size: cover;
            background-position: left center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .login-container {
            min-height: 100vh;
        }

        .login-card {
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(11, 42, 82, 0.28);
            max-width: 420px;
            width: 100%;
            margin-right: 40px;
        }

        .login-card h3 {
            font-family: Poppins, Inter, sans-serif;
            font-weight: 600;
            font-size: 24px;
            color: #1A2433;
        }

        .login-card .text-muted,
        .login-card .text-secondary {
            color: #55627A !important;
        }

        .login-card .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #1A2433 !important;
            margin-bottom: 8px;
        }

        .login-card .form-control {
            min-height: 44px;
            border: 1.5px solid #8A94A6;
            border-radius: 8px;
            font-size: 14px;
        }

        .login-card .input-group .form-control {
            border-radius: 8px 0 0 8px;
        }

        .login-card .form-control:focus {
            border-color: #1D5FC4;
            box-shadow: 0 0 0 3px rgba(29, 95, 196, .25);
        }

        .toggle-password {
            cursor: pointer;
            background: transparent;
            border: 1.5px solid #8A94A6;
            border-left: none;
            border-radius: 0 8px 8px 0;
            color: #55627A;
            min-width: 48px;
        }

        .toggle-password:hover {
            background: #F4F6FA;
            color: #1A2433;
        }

        .login-card .btn-primary {
            background: #1D5FC4;
            border-color: #1D5FC4;
            min-height: 44px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 200ms ease, box-shadow 200ms ease;
        }

        .login-card .btn-primary:hover {
            background: #164CA0;
            border-color: #164CA0;
            box-shadow: 0 4px 10px rgba(11, 42, 82, .28);
        }

        .login-card .btn:focus-visible,
        .login-card a:focus-visible {
            outline: 3px solid #FFB020;
            outline-offset: 2px;
        }

        .login-card .form-check-input:checked {
            background-color: #1D5FC4;
            border-color: #1D5FC4;
        }

        .login-card a {
            color: #1D5FC4;
            font-weight: 500;
        }

        .login-card .alert-danger {
            background: #FDECEA;
            border-color: #E7A9A5;
            color: #B3261E;
            font-weight: 500;
            font-size: 14px !important;
            border-radius: 8px;
        }

        @media (max-width: 767px) {
            .login-card {
                margin: 16px;
            }

            .login-container {
                align-items: flex-end !important;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid login-container d-flex align-items-center">
        <div class="row w-100 m-0 align-items-center">
            <!-- Area Kiri Mendorong Form ke Kanan -->
            <div class="col-lg-6 col-md-5 d-none d-md-block"></div>

            <!-- Area Kanan Tempat Form Login -->
            <div
                class="col-lg-6 col-md-7 d-flex align-items-center justify-content-center justify-content-lg-start ps-lg-4">
                <div class="card login-card p-4 p-md-5 border-0 bg-white">

                    <h3 class="fw-bold mb-1 text-dark">Selamat Datang</h3>
                    <p class="text-muted small mb-4">Masuk ke akun Anda sebagai Super Admin atau Trainer untuk mengakses
                        sistem training analytics.</p>

                    <form method="post" action="">
                        {% csrf_token %}

                        {% if error %}
                        <div class="alert alert-danger py-2 small mb-3" role="alert">{{ error }}</div>
                        {% endif %}

                        <!-- Username / Email -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">{{ form.identifier.label }}</label>
                            {{ form.identifier }}
                        </div>

                        <!-- Kata Sandi -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">{{ form.password.label }}</label>
                            <div class="input-group">
                                {{ form.password }}
                                <button class="btn btn-outline-secondary toggle-password" type="button"
                                    id="togglePasswordBtn">
                                    <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Ingat Saya & Lupa Kata Sandi -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                {{ form.remember }}
                                <label class="form-check-label small text-muted" for="{{ form.remember.id_for_label }}">
                                    {{ form.remember.label }}
                                </label>
                            </div>
                        </div>

                        <!-- Tombol Masuk -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Masuk &rarr;</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Fitur Mata Toggle Password -->
    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.querySelector('input[type="password"]') || document.querySelector('input[name="password"]');
        const toggleIcon = document.getElementById('toggleIcon');

        toggleBtn.addEventListener('click', function () {
            // Toggle tipe input antara 'password' dan 'text'
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle ikon mata
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    </script>

</body>

</html>
