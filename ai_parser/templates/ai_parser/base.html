<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STA Manpower Data{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f7f8fa;color:#202735}
    .container{max-width:1400px;margin:32px auto;padding:0 20px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    h1{font-size:26px;margin:0 0 6px}.muted{color:#697586;font-size:13px}
    .btn{display:inline-block;border:0;border-radius:6px;padding:10px 14px;background:#2369d8;color:white;text-decoration:none;cursor:pointer;font-size:14px}
    .btn.secondary{background:#e9edf5;color:#243247}.panel{background:white;border:1px solid #dfe3e8;border-radius:10px;padding:18px;margin-top:20px}
    .messages{padding:12px 14px;border-radius:7px;background:#e8f6ee;margin:12px 0}
    .errorlist{color:#b42318}.field{margin:12px 0}input[type=file],input[type=search]{padding:10px;border:1px solid #cfd5df;border-radius:6px}
    table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px 10px;border:1px solid #ddd;font-size:14px;vertical-align:middle}
    th{background:#f0f0f0;font-weight:600;white-space:nowrap}select{padding:8px;border:1px solid #c5ccd6;border-radius:5px;background:white;max-width:180px}
    .table-wrap{overflow-x:auto}.status{font-size:12px;color:#64748b}.good{color:#087443}.bad{color:#b42318}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.stat{background:white;border:1px solid #e0e4ea;border-radius:8px;padding:14px;min-width:140px}.stat b{display:block;font-size:22px;margin-top:6px}
    a{color:#1769e0}.notice{padding:10px;background:#fff6df;border-radius:6px;margin:10px 0}
  </style>
</head>
<body><main class="container">
  {% if messages %}{% for message in messages %}<div class="messages">{{ message }}</div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main></body></html>
